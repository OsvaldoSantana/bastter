# Captura diaria da CVM (DFP, ITR, CAD) -- P-57, docs/decisoes/P-57.md -- e, desde
# 24/09/2026, do COTAHIST da B3 (P-135).
#
# Roda sem a maquina dele ligada (P7). O byte vai para o armazem (Cloudflare R2); o git
# recebe so o registro, e so quando ele muda. A prova de que a rotina rodou num dia sem
# mudanca e o log `logs/capturas/<AAAA-MM-DD>.csv` no armazem.
#
# Falha = job vermelho, e o GitHub avisa por e-mail. O registro e commitado MESMO com
# falha (uma linha `rejeitado` e historia), e so depois o job fica vermelho.
#
# Credenciais: segredos do repositorio R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_BUCKET. Nenhum passo os imprime.

name: Captura CVM

on:
  schedule:
    - cron: '15 9 * * *'          # 06:15 em Brasilia, todo dia
  workflow_dispatch:

# duas capturas ao mesmo tempo disputariam o registro e o armazem: a segunda espera
concurrency:
  group: captura-cvm
  cancel-in-progress: false

permissions:
  contents: write
  issues: write         # a issue de aviso do armazem

jobs:
  captura:
    runs-on: ubuntu-24.04   # fixo: o label ubuntu-latest muda de imagem em 19/10/2026
    timeout-minutes: 120
    steps:
      # Acoes de terceiro fixadas pelo SHA do commit, nao pelo tag: o tag e movel, e este
      # job tem os segredos do R2 no ambiente de dois passos e escrita no repositorio. O SHA
      # e o que `v4`/`v5` apontavam em 24/09/2026 (git ls-remote) -- o mesmo codigo que rodou
      # verde na 36045126980. Subir de versao e trocar o SHA e o comentario juntos.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Instalar
        run: python -m pip install ".[captura]"

      - name: Capturar
        id: captura
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set +e
          python fase0/capturar_cvm.py --armazem s3
          echo "codigo=$?" >> "$GITHUB_OUTPUT"

      # P-135: o COTAHIST pelo mesmo armazem, portao e teto. Diario a cada pregao, anual
      # uma vez por mes (conciliacao). A B3 respondeu 200 ao runner em 24/09 (execucao
      # 36043565046, fase0/sondar_cotahist.py).
      - name: Capturar COTAHIST
        id: captura_b3
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set +e
          python fase0/capturar_cotahist.py --armazem s3
          echo "codigo=$?" >> "$GITHUB_OUTPUT"

      # `git status`, nao `git diff`: o registro da B3 nasce nesta rotina, e arquivo novo
      # nao aparece no diff -- o primeiro registro nunca seria commitado.
      - name: Commitar o registro, se mudou
        if: always()
        run: |
          set -euo pipefail
          REGS="docs/acervo/cvm/capturas.csv docs/acervo/b3/capturas.csv"
          if [ -z "$(git status --porcelain -- $REGS)" ]; then
            echo "registros inalterados: nada a commitar (a prova da rodada esta no log do armazem)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $REGS
          git commit -m "Captura $(date -u +%Y-%m-%d): registro"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # politica.yaml -> armazem: acima do aviso, UMA issue (a aberta e atualizada, nunca
      # uma por dia). Vale a medida da B3, que roda depois e ja ve o que a CVM enviou.
      # Acima do teto a captura ja recusou e o passo seguinte fica vermelho.
      - name: Avisar se o armazem passou do aviso
        if: always() && ((steps.captura_b3.outputs.armazem_nivel || steps.captura.outputs.armazem_nivel) == 'aviso' || (steps.captura_b3.outputs.armazem_nivel || steps.captura.outputs.armazem_nivel) == 'teto')
        env:
          GH_TOKEN: ${{ github.token }}
          GB: ${{ steps.captura_b3.outputs.armazem_gb || steps.captura.outputs.armazem_gb }}
          NIVEL: ${{ steps.captura_b3.outputs.armazem_nivel || steps.captura.outputs.armazem_nivel }}
        run: |
          set -euo pipefail
          titulo="Armazem em ${GB} GB"
          corpo="Medido em $(date -u +%Y-%m-%dT%H:%M:%SZ) pela captura: ${GB} GB no bucket, nivel '${NIVEL}'. Limites em alocacao/politica.yaml -> armazem (aviso_gb, teto_gb). Acima do teto nada sobe e o registro ganha recusado_por_teto."
          n=$(gh issue list --state open --search 'in:title "Armazem em"' --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue edit "$n" --title "$titulo" --body "$corpo"
          else
            gh issue create --title "$titulo" --body "$corpo"
          fi

      - name: Falhar se a captura falhou
        if: always() && (steps.captura.outputs.codigo != '0' || steps.captura_b3.outputs.codigo != '0')
        run: |
          echo "CVM saiu com '${{ steps.captura.outputs.codigo }}'; COTAHIST com '${{ steps.captura_b3.outputs.codigo }}'"
          exit 1
