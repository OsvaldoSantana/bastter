# Mutacao: UMA medicao, manual (25/09/2026). Nao entra no push, pelo custo.
#
# Linux porque o mutmut nao roda em Windows -- medido na maquina dele em 25/09: "To run
# mutmut on Windows, please use the WSL", e ela nao tem WSL. Alvos e opcoes em
# pyproject.toml -> [tool.mutmut]: ajustar.py, estado_io.py, os portoes (alocacao.py) e
# insumo_ml.py.
#
# O resultado sai como artefato (a lista de sobreviventes). Cada mutante sobrevivente e um
# ACHADO CANDIDATO: uma mudanca no codigo que nenhum teste percebeu. Candidato, porque um
# mutante equivalente (que nao muda comportamento) tambem sobrevive -- quem promove a
# achado e a leitura (regua 5-B, pergunta 3).

name: Mutacao

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Instalar
        run: python -m pip install ".[dev,mutacao]"
      - name: Rodar o mutmut
        run: |
          set +e
          python -m mutmut run
          echo "mutmut saiu com $?"
          python -m mutmut results > mutmut-resultados.txt 2>&1
          cat mutmut-resultados.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: mutmut-resultados
          path: mutmut-resultados.txt
