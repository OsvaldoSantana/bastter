# Os bytes que o pre-registro ML v2 fixou, como DADO (P2) -- P-139, 24/09/2026.
#
# O pre-registro (preregistro-ml-v2.md, secao 2) fixa o COTAHIST_A2026.ZIP pelo sha256
# do ZIP. Este arquivo TRANSCREVE esse pin para que o leitor da familia ML
# (fase0/insumo_ml.py) o aplique; nao o altera. `test_insumo_ml.py` reprova se o sha256,
# os bytes ou os pregoes daqui deixarem de aparecer no .md -- duas declaracoes da mesma
# coisa concordam por acidente ate o dia em que nao concordam (N-01).
#
# `impressao` NAO e escolha nova: e uma MEDIDA do mesmo byte fixado, restrita a janela
# de teste do pre-registro (ate ago/2026). Existe por causa do CH-01: a B3 regera o anual
# e troca a ordem das linhas sem mudar o conteudo, entao o sha256 do ZIP muda sem o dado
# mudar. Medida em 24/09/2026 no fb3546ed e no 4f2cf2aa, com o mesmo resultado.
#
# P-140 (25/09/2026, decisao tecnica registrada): 2004 a 2025 fixados aqui. A HIERARQUIA
# de cada entrada:
#   impressao  -- o PINO PRINCIPAL. Conteudo da janela (linhas TIPREG=01 ordenadas). E ela
#                 que decide: diferente, `InsumoBloqueado`.
#   sha256, bytes -- o OBSERVADO, secundario: o byte medido. O leitor o abre primeiro (so
#                 ele garante tambem a ordem das linhas); se nao estiver disponivel, le a
#                 vigente e, com a mesma impressao, segue com `AvisoRecompressao` (CH-01).
# Por que 2004: a maior janela de preco da secao 5.1 e a reversao, 36 a 60 meses atras
# (H-ML7). Do primeiro mes de decisao possivel (jan/2010), 60 meses e o fim de jan/2005, e
# o ultimo negocio ate essa data pode estar em dez/2004. Guardado por
# test_insumo_ml.py::test_P140_os_anos_fixados_cobrem_a_maior_janela_do_preregistro.
# `ate` = 31/12 do ano; 2026 continua com a janela do teste (ago/2026). Medidos com
# `py -3.11 fase0/insumo_ml.py --medir 2004-2025` (54,5 s nesta maquina, 25/09), e
# conferidos contra a versao vigente do inventario do acervo: 22 de 22.
#
# Ano que nao esta aqui NAO foi fixado. O leitor devolve a versao vigente com o sha256 ao
# lado e `fixado: False`.

