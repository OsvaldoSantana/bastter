# ─────────────────────────────────────────────────────────────────────────────
# instituicoes.yaml — o catalogo de casas. Pendencia P-36, metade B.
#
# POR QUE ESTE ARQUIVO EXISTE.
#
# Ate 05/09/2026 estas 24 instituicoes eram 136 linhas de literais Python dentro de
# `corretoras.catalogo_instituicoes()`: ~15 campos MEDIDOS por casa, com `fonte=` e
# `confirmacao=` inline. Era dado de pesquisa dentro de codigo, fora de todo o
# aparato de procedencia do custos.yaml. Mudar a corretagem do Itau era editar
# Python, e nada testava se aquele numero tinha procedencia.
#
# ACHADO Q-02, encontrado ao migrar — e ele muda o que o arquivo AFIRMA.
#
#   O campo `confirmacao` era UMA letra (C/P/N) por instituicao, e `pontuar()` a
#   aplica como MULTIPLICADOR DE TUDO: N zera a nota inteira. Mas a letra nunca
#   significou "este registro e confiavel". Ela sempre significou "os CUSTOS podem
#   ser lidos em fonte oficial" — a propria `regra` do multiplicador, em
#   politica.yaml, diz isso com todas as letras: "instituicao cujo custo nao pode ser
#   lido em fonte oficial NAO entra em ordenacao, por melhor que pareca pelo balanco".
#
#   As fontes provam: BTG, Bradesco, Mirae e Avenue tem `confirmacao: N` e `fonte`
#   dizendo "BCB IF.data 03/2026 (porte) — custos NAO OBTIDOS". O balanco deles vem
#   do BANCO CENTRAL e esta perfeitamente confirmado. O indice de reclamacoes do BTG
#   e do Bradesco vem do ranking do BC, tambem primario, tambem confirmado.
#
#   O COMPORTAMENTO estava certo (nao publicar custo tira da ordenacao, por decisao
#   declarada). O REGISTRO e que nao sabia dizer isso: um leitor do arquivo antigo
#   concluiria que o dado de balanco do BTG e duvidoso, quando ele veio do regulador.
#
#   Aqui a procedencia e POR GRUPO DE CAMPOS, porque e assim que as fontes de fato se
#   agrupam — custos vem da pagina da casa, balanco vem do IF.data, reclamacoes vem
#   do ranking do BC. E `confirmacao` deixou de ser um campo proprio: ela e DERIVADA
#   de `custos.procedencia.status`. Dois campos que podiam discordar viraram um.
#
# O QUE ESTE ARQUIVO NAO CONSERTA
#   A granularidade e por GRUPO e nao por campo, e isso e escolha. Procedencia por
#   campo daria 24 x 15 = 360 blocos para registrar cinco fontes reais — bloat que
#   ninguem leria, e registro que ninguem le e pior que registro nenhum. Se um campo
#   um dia vier de fonte diferente da do grupo, ele precisa de grupo proprio.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  versao: "1.0.0"
  emissao: 2026-09-05
  origem: "extraido de corretoras.catalogo_instituicoes(), 136 linhas de literais Python"
  pesquisa: "31/08 e 01/09/2026"
  como_ler_status: >
    COMPLETO / PARCIAL / NAO_CONFIRMADO, a mesma taxonomia do custos.yaml. O status de
    `custos.procedencia` e o que vira o multiplicador de confirmacao do ranking: 1,00 /
    0,75 / 0,00, com os fatores declarados em politica.yaml -> corretora.
    multiplicador_de_confirmacao. Status de OUTRO grupo nao multiplica nada — ele diz
    apenas o que aquele grupo de campos vale.

