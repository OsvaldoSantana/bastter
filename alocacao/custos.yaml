    nota: 'ACHADO J-01, CORRIGIDO em 05/09/2026 pelo usuario: o bloqueio NAO E PERMANENTE, e
      CICLICO. ''O dinheiro esta bloqueado ate eu pagar a fatura, que sera dia 10.'' O saldo
      destrava ao pagar e volta a travar conforme ele usa o cartao.

      Isso NAO salva a funcao LIQUIDEZ, e por um motivo que a media esconde: emergencia nao
      escolhe o dia. Pela data em que ela cair, a espera vai de 0 dias (dia 10) a 29 dias (dia
      11), com media perto de 15. A funcao exige resgate em ate 1 dia, e o que importa para
      reserva de emergencia e o PIOR caso, nao o medio — ''o dinheiro volta dia 10'' nao e resposta
      para um problema que aconteceu dia 11.

      NAO declara `bloqueia`: o valor existe e e conhecido, ele muda o numero em vez de impedir
      conta. O efeito esta em estado.yaml -> reserva_disponivel.'
    liquidez_pior_caso_dias: 29
    liquidez_media_dias: 15
    vencimento_da_fatura: dia 10
