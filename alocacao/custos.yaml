# Constantes de custo — procedência por valor, não por bloco.
# Regra: valor com status NAO_CONFIRMADO tem `valor: null` e lista o que ele bloqueia.
# Um cálculo que dependa de valor bloqueado RECUSA-SE a rodar.
#
# ── VALIDADE (política de 05/09/2026) ────────────────────────────────────────
# `expira` é uma DATA quando a fonte tem ciclo de revisão; é `null` quando não tem.
# Data inventada é pior que ausência: dá sensação de controle sobre um valor que
# ninguém está vigiando.
#
#   tarifa de bolsa   90 dias — a B3 republica sem aviso, e a deriva já foi medida
#                     (R$24.164,73 no OC 041/2024 -> R$26.471,77 na v5.0)
#   taxa de fundo     365 dias — regulamento muda em assembleia, ciclo anual
#   indicador macro   dias — série diária do BCB
#   tabela comercial  90 dias — corretora muda quando quer
#   LEI               expira: null + `revisar_se`. Uma lei não vence no aniversário,
#                     vence quando é alterada. Vários .md já registram "Vide MP
#                     1.303/2025": a pressão de alteração é real e não tem data fixa.
#                     `revisar_se` nomeia o gatilho. Para lei, quem avisa é a leitura
#                     da fonte, não o calendário.
#
# ── CONFERÊNCIA DE TRECHO (MAPA-CONSTANTES.md) ──────────────────────────────
# `trecho_conferido: false` marca constante cujo `fonte` cita documento e artigo
# reais cujo TRECHO não está em nenhum .md de docs/fontes. Não é divergência de
# valor nem ausência de fonte: é citação que parece procedência e não é verificável.
# O status NÃO foi rebaixado — isso é decisão do usuário (pendência P-03).

